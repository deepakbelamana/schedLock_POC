server.port=0

# Spring's scheduler uses ONE thread by default, which means jobs wait for each other.
# 4 threads lets our jobs run side by side.
spring.task.scheduling.pool.size=4

# ---------- Part 2: schedule config ----------
# Change these and restart: no Java code change needed.
jobs.report.enabled=false
jobs.report.cron=*/20 * * * * *

# ---------- Part 3: schedule lock ----------
jobs.locked.cron=*/15 * * * * *

# ---------- Shared database (needed by ShedLock) ----------
# AUTO_SERVER=TRUE lets two copies of the app open the same database file at once.
spring.datasource.url=jdbc:h2:file:./data/lockdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# Creates the "shedlock" table on startup (see schema.sql)
spring.sql.init.mode=always
